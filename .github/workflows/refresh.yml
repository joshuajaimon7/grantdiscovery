name: Refresh Grant Report

on:
  # Run automatically on the 1st of every month at 9am UTC
  schedule:
    - cron: '0 9 1 * *'

  # Allow manual trigger from the GitHub Actions tab
  # Kirstie or Joshua clicks: Actions → Refresh Grant Report → Run workflow
  workflow_dispatch:
    inputs:
      depth:
        description: 'Search depth (quick/standard/full)'
        required: false
        default: 'standard'
        type: choice
        options:
          - quick
          - standard
          - full

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # 5-hour safety cap (well within GitHub's 6-hr limit)
    permissions:
      contents: write   # needed to commit results back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests lxml

      - name: Run grant discovery (full run with email templates)
        run: |
          DEPTH="${{ github.event.inputs.depth || 'standard' }}"
          echo "Running in $DEPTH mode..."
          python steamery_grant_finder.py
        # Full run: discovers foundations, screens them, checks IRS XML grant history,
        # and generates email templates for the top candidates.
        # standard depth (~35 min on GitHub's servers)

      - name: Commit updated report
        run: |
          git config user.name  "STEAMery Grant Bot"
          git config user.email "bot@github-actions"
          git add report.html results.json results.csv
          git diff --staged --quiet || git commit -m "Auto-refresh: $(date +'%B %d, %Y') grant report"
          git push

      - name: Summary
        run: |
          echo "✅ Grant report updated!"
          echo "📊 View results at: https://joshuajaimon7.github.io/grantdiscovery/"
          echo "📄 Direct report:   https://joshuajaimon7.github.io/grantdiscovery/report.html"
